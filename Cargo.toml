[package]
name = "noxadbrs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
axum = { version = "=0.8.9", default-features = false, features = ["tokio", "http1", "form", "query", "multipart"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
# ring runs TLS; aws-lc-rs only lends its HPKE, which Encrypted Client Hello needs and ring lacks.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "aws_lc_rs", "std"] }
rustls-platform-verifier = "=0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "=1.54.1", features = ["rt", "macros", "signal", "time", "net", "sync"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
tokio-websockets = { version = "=0.13.3", default-features = false, features = ["client", "fastrand", "sha1_smol", "rustls-platform-verifier"] }
tower = { version = "=0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
twilight-gateway = "=0.18.0"
twilight-http = "=0.18.0"
twilight-model = "=0.18.0"
twilight-util = { version = "=0.18.0", features = ["builder"] }

[dev-dependencies]
twilight-validate = "=0.18.0"

# Small and lean for the Pi: one optimised unit, link-time optimisation, no debug symbols.
[profile.release]
codegen-units = 1
lto = "thin"
strip = true
